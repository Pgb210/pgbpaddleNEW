<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f5040" />
  <title>Offline — PGB Padel Booking</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #0f5040; color: #1a1f18; font-family: sans-serif; }
    main { width: 100%; max-width: 400px; padding: 32px; border-radius: 16px; background: #fff; }
    img { display: block; width: 64px; height: 64px; margin-bottom: 24px; border-radius: 12px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #6b7569; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
    a { display: block; padding: 12px; border-radius: 8px; background: #0f5040; color: #fff; text-align: center; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #2ea87e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="64" height="64" />
    <h1>You’re offline</h1>
    <p>PGB Padel Booking needs an internet connection to show current availability and save bookings. No bookings can be viewed, created, or cancelled here while offline.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
