<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Cancel booking · PGB Padel</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/cancel-booking.css">
<script src="/cancel-booking.js" defer></script>
</head>
<body>
<main>
<a class="brand" href="/">PGB PADEL</a>
<p class="eyebrow">YOUR COURT BOOKING</p>
<h1>Cancel your booking</h1>
<p id="status" role="status" aria-live="polite">Checking your private cancellation link…</p>
<section id="details" hidden>
<h2>PGB Padel Court</h2>
<p id="date"></p><p id="time"></p>
<p class="note">Confirm below to cancel this booking and release your time slot. All times are Europe/Dublin. You can cancel until your booking starts.</p>
<form id="confirmation"><button id="cancel" type="submit">Confirm cancellation</button></form>
</section>
<a class="back" href="/">Return to bookings</a>
<noscript><p>Enable JavaScript to securely view and cancel your booking.</p></noscript>
</main>
</body>
</html>
